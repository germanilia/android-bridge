services:
  relay:
    image: android-bridge-relay:1.0.0
    container_name: android-bridge-relay
    restart: unless-stopped
    env_file:
      - ./deployments/homeserver/env.homeserver
    environment:
      RELAY_SETUP_CODE: ${RELAY_SETUP_CODE:?RELAY_SETUP_CODE must be set in .env}
    volumes:
      - relay_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - system_default

networks:
  system_default:
    external: true

volumes:
  relay_config:
    name: android_bridge_relay_config
